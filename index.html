<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Election maps by Jackson A. Hannan. Selected work and the full map archive.">
  <title>Election maps — Jackson A. Hannan</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="data/gallery.js" defer></script>
  <script src="gallery.js" defer></script>
</head>
<body>
  <a class="skip" href="#collection">Skip to maps</a>
  <header class="masthead wrap">
    <div class="identity">
      <h1><a href="index.html">Jackson A. Hannan</a></h1>
      <p>Election maps</p>
    </div>
    <nav aria-label="Work">
      <button id="selected-view" type="button" aria-pressed="true">Selected</button>
      <button id="archive-view" type="button" aria-pressed="false">All maps</button>
    </nav>
  </header>
  <main id="collection" class="wrap">
    <h2 class="sr-only">Map portfolio</h2>
    <div id="browse-controls" hidden>
      <form id="filters" role="search" aria-label="Find a map">
        <div class="search-field">
          <label for="search">Search</label>
          <input id="search" name="q" type="search" placeholder="Race, district, or year" autocomplete="off">
        </div>
        <div>
          <label for="state">Geography</label>
          <select id="state" name="state"><option value="">All geographies</option></select>
        </div>
        <details id="more-filters">
          <summary id="more-filter-label">More filters</summary>
          <div class="extra-filters">
            <div class="wide-field">
              <label for="series">Collection</label>
              <select id="series" name="series"><option value="">All collections</option></select>
            </div>
            <div>
              <label for="year">Year</label>
              <select id="year" name="year"><option value="">All years</option></select>
            </div>
            <div>
              <label for="category">Subject</label>
              <select id="category">
                <option value="">All subjects</option>
                <option>Election results</option>
                <option>Electoral change</option>
                <option>Turnout</option>
                <option>Scenarios</option>
                <option>Analysis</option>
                <option>Design studies</option>
              </select>
            </div>
            <div class="wide-field">
              <label for="sort">Sort</label>
              <select id="sort">
                <option value="curated">Selected first</option>
                <option value="newest">Latest election year</option>
                <option value="title">Title A–Z</option>
              </select>
            </div>
          </div>
        </details>
      </form>
      <div class="results-line">
        <p id="results-count" role="status" aria-live="polite"></p>
        <button id="reset" class="text-button" type="button" hidden>Clear filters</button>
      </div>
    </div>
    <div id="gallery" class="gallery"></div>
    <div id="empty" class="empty" hidden>
      <p>No maps found.</p>
      <button id="empty-reset" type="button">Clear filters</button>
    </div>
    <div id="load-area" class="load-area" hidden>
      <button id="load-more" type="button">More maps</button>
    </div>
    <noscript>
      <p>JavaScript is needed to browse the archive. Original maps:</p>
      <ul>
        <li><a href="outputs/alabama-2017-senate-special-election/alabama-2017-senate-special-election-margin-by-precinct.png">Alabama Senate special election, 2017</a></li>
        <li><a href="outputs/tennessee-2016-2024-presidential-swing/tennessee-presidential-shift-2016-2024.png">Tennessee presidential shift, 2016–2024</a></li>
        <li><a href="outputs/alabama-1992-2024-presidential-realignment/alabama-presidential-realignment-1992-2024.png">Alabama county realignment, 1992–2024</a></li>
      </ul>
    </noscript>
  </main>
  <footer class="wrap">
    <a href="docs/DATA_SOURCES.md">Sources</a>
    <a href="https://github.com/JacksonAHannan/election-map-portfolio">Code</a>
  </footer>
  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-toolbar">
      <h2 id="viewer-title"></h2>
      <button id="close-viewer" type="button" aria-label="Close map viewer">Close</button>
    </div>
    <div class="viewer-canvas"><img id="viewer-image" alt=""></div>
    <div class="viewer-controls">
      <button id="previous" type="button">Previous</button>
      <a id="full-image" href="#" target="_blank" rel="noopener">Large image</a>
      <button id="next" type="button">Next</button>
    </div>
    <div class="viewer-description">
      <p id="viewer-caveat" hidden></p>
      <p id="viewer-credit" hidden></p>
      <details id="map-details">
        <summary>Sources and details</summary>
        <p id="viewer-collection"></p>
        <p id="viewer-claim"></p>
        <pre id="viewer-notes"></pre>
        <p id="viewer-source" class="source-id"></p>
      </details>
    </div>
  </dialog>
</body>
</html>
