[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "election-map-portfolio"
version = "0.1.0"
description = "Source-attributed election cartography and audited spatial crosswalk case studies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["geopandas>=1.1,<2", "matplotlib>=3.10,<4", "numpy>=1.26,<3", "pandas>=2.2,<4", "openpyxl>=3.1,<4", "xlrd>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<9", "pillow>=10,<13"]

[tool.setuptools.packages.find]
include = ["election_maps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
